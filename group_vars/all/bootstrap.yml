---
# Bootstrap variables for playbooks/bootstrap_host.yml
# Uses the control machine's login user ($USER) — must match the VM account name.
bootstrap_ansible_user: "{{ lookup('env', 'USER') | default(lookup('env', 'LOGNAME'), true) }}"
bootstrap_create_deploy_user: false
bootstrap_deploy_user: deploy
bootstrap_sudoers_file: /etc/sudoers.d/90-ansible
bootstrap_sudoers_mode: "0440"

bootstrap_packages:
  - python3
  - python3-apt
  - python3-psycopg2
  - sudo
  - acl
  - curl
  - ca-certificates
  - gnupg
  - openssh-server

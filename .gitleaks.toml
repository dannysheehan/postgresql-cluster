# gitleaks configuration
#
# The Molecule lab credentials are fake by design and must stay readable so the
# lab runs without the operator's vault password. Example files carry
# placeholders. Everything else is scanned.
[extend]
useDefault = true

[allowlist]
description = "Deliberately fake credentials: lab fixtures and example files"
paths = [
  '''molecule/lab_group_vars/all/vault\.yml''',
  '''group_vars/all/vault\.yml\.example''',
  '''vars/apps/example\.yml''',
]

---
- name: Install NFS client tools when using NFS repo
  ansible.builtin.apt:
    name:
      - nfs-common
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: pgbackrest_use_nfs | bool

- name: Install pgBackRest from PGDG
  ansible.builtin.apt:
    name: pgbackrest
    state: present

- name: Ensure local pgBackRest repo directory exists
  ansible.builtin.file:
    path: "{{ pgbackrest_repo_path }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"
  when: not (pgbackrest_use_nfs | bool)

- name: Ensure NFS mount point exists
  ansible.builtin.file:
    path: "{{ pgbackrest_nfs_mount }}"
    state: directory
    mode: "0755"
  when: pgbackrest_use_nfs | bool

- name: Mount Synology NFS share for pgBackRest
  ansible.posix.mount:
    path: "{{ pgbackrest_nfs_mount }}"
    src: "{{ pgbackrest_nfs_server }}:{{ pgbackrest_nfs_export }}"
    fstype: "{{ pgbackrest_nfs_fstype }}"
    opts: "{{ pgbackrest_nfs_opts }}"
    state: mounted
  when: pgbackrest_use_nfs | bool

- name: Ensure pgBackRest repo directory exists on NFS mount
  ansible.builtin.file:
    path: "{{ pgbackrest_repo_path }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"
  when: pgbackrest_use_nfs | bool

- name: Ensure pgBackRest config directory exists
  ansible.builtin.file:
    path: /etc/pgbackrest
    state: directory
    owner: postgres
    group: postgres
    mode: "0755"

- name: Deploy pgBackRest configuration
  ansible.builtin.template:
    src: pgbackrest.conf.j2
    dest: /etc/pgbackrest/pgbackrest.conf
    owner: postgres
    group: postgres
    mode: "0640"

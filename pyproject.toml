[project]
name = "postgresql-cluster"
version = "0.1.0"
description = "2-node active/passive PostgreSQL cluster (Ansible + Molecule/Vagrant)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "ansible-core>=2.16,<2.19",
  "molecule>=25.0.0,<27.0.0",
  "molecule-vagrant>=2.0.0",
  "ansible-lint>=24.0.0",
  "yamllint>=1.35.0",
  "netaddr>=1.0.0",
  "psycopg2-binary>=2.9.0",
]

[tool.uv]
package = false
python-preference = "managed"
